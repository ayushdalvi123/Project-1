<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <span class="dot"></span>
      <h1>Chatbot</h1>
    </header>

    <div id="messages" class="messages" aria-live="polite">
      <div class="msg bot">Hi! Ask me anything, or type "help".</div>
    </div>

    <form id="form" class="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Type a message..." required autofocus>
      <button type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      const typing = addMessage("...", "bot typing");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typing.className = "msg bot";
        typing.textContent = data.reply;
      } catch (err) {
        typing.className = "msg bot";
        typing.textContent = "Sorry, I couldn't reach the server.";
      }
    });
  </script>
</body>
</html>
